<section class="content">
  <div class="block-content">
    <h3 class="block-title">Contacto</h3>

    <div class="row">
      <!-- FORMULARIO -->
      <div class="col-md-6">
        <form
          #formulario
          class="contact-form"
          id="contact_form"
          (ngSubmit)="enviarMensaje(contactForm)"
          #contactForm
          novalidate
        >
          <div class="form-control-wrap">
            <!-- Nombre -->
            <div class="form-group">
              <input
                type="text"
                class="form-control"
                id="fname"
                name="user_name"
                placeholder="Nombre*"
                [(ngModel)]="contacto.nombre"
                required
                minlength="2"
              />
            </div>

            <!-- Correo -->
            <div class="form-group mar-top-40">
              <input
                type="email"
                class="form-control"
                id="email"
                name="user_email"
                placeholder="Correo Electronico*"
                [(ngModel)]="contacto.email"
                required
                email
              />
            </div>

            <!-- ASUNTO (NUEVO) -->
            <div class="form-group mar-top-40">
              <input
                type="text"
                class="form-control"
                id="subject"
                name="subject"
                placeholder="Asunto"
                [(ngModel)]="contacto.asunto"
                maxlength="100"
              />
            </div>

            <!-- MENSAJE -->
            <div class="form-group mar-top-60">
              <textarea
                class="form-control"
                rows="10"
                name="message"
                id="comment"
                placeholder="Su Mensaje"
                [(ngModel)]="contacto.mensaje"
                required
                minlength="10"
                maxlength="2000"
              >
              </textarea>
            </div>

            <!-- MENSAJE ÉXITO -->
            @if (mensajeExito) {
              <div class="alert alert-success mt-3" role="alert">
                {{ mensajeExito }}
              </div>
            }

            <!-- MENSAJE ERROR -->
            @if (mensajeError) {
              <div class="alert alert-danger mt-3" role="alert">
                {{ mensajeError }}
              </div>
            }

            <!-- BOTÓN -->
            <div class="form-group mar-top-40">
              <button type="submit" class="btn v7" [disabled]="enviando">
                @if (enviando) {
                  <span
                    class="spinner-border spinner-border-sm me-2"
                    aria-hidden="true"
                  >
                  </span>

                  Enviando...
                } @else {
                  Enviar mensaje
                }
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- INFORMACIÓN DE CONTACTO -->
      <div class="col-md-5 offset-md-1">
        <div class="contact-content">
          <div class="contact-icon">
            <i class="ion-ios-location-outline"></i>
          </div>

          <div class="contact-details">
            <h5>Dirección:</h5>
            <p>Dirección: Puebla, México.</p>
          </div>
        </div>

        <div class="contact-content">
          <div class="contact-icon">
            <i class="ion-ios-telephone-outline"></i>
          </div>

          <div class="contact-details">
            <h5>Teléfono:</h5>
            <p><a href="tel:+5212221124889">+52 1 222 112 4889</a></p>
          </div>
        </div>

        <div class="contact-content">
          <div class="contact-icon">
            <i class="ion-ios-email-outline"></i>
          </div>

          <div class="contact-details">
            <h5>Correo:</h5>
            <p>angeldesarrolloweb&#64;gmail.com</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
